  feature_manifest: style_features_l18_l24_siglip_l24/manifest.parquet
  feature_directory: style_features_l18_l24_siglip_l24
  content_source_directory: synthetic_teacher_500x16
  artist_count: 5000
  validation_artists: 250
  meta_test_artists: 250
  reference_images_per_split:
    train: 4
    validation: 1
    test: 1
  seed: 20260813
  text_batch_size: 512
  text_shard_rows: 512
  style_token_directory: resampler_tokens
  style_token_batch_size: 32
  style_token_prefetch_shards: 4
  offline_bootstrap:
    output_directory: offline_kvo_reference_head_batch64_gpu_cache_v6
    # Reuse the frozen common-effect connector learned on exact synthetic
    # teacher images. Only the reference-conditioned head is updated here.
    initial_checkpoint: ../synthetic_teacher_500x16/offline_kvo_bootstrap_exact512_summary_tokens/checkpoints/best.pt
    phase_a_checkpoint: ../synthetic_teacher_500x16/offline_kvo_bootstrap_exact512_summary_tokens/checkpoints/best.pt
    query_probe_directory: ../synthetic_teacher_500x16/query_probe_bank
    seed: 20260814
    steps: 8000
    batch_size: 8
    # Random block subsampling yields 8 samples × 2 blocks per step; over
    # 8k steps every Anima block receives about 4.6k sample exposures.
    blocks_per_step: 2
    functional_blocks_per_step: 1
    queries_per_step: 8
    # H100 80GB can retain ~42GB packed text conditions plus ~8GB frozen
    # Resampler tokens. This removes the CPU assembly/H2D bottleneck that left
    # SM utilization near zero while six CPU cores fed tiny tensor copies.
    gpu_resident_small_caches: true
    gpu_resident_tokens: true
    gpu_resident_probes: true
    ram_resident_features: false
    resampler_trainable_encoder_layers: 0
    representation_warmup_steps: 0
    centered_effect_head: true
    centered_effect_latent_dim: 512
    centered_effect_learning_rate: 0.0001
    centered_effect_max_grad_norm: 1.0
    centered_effect_residual_weight: 1.0
    centered_effect_direction_weight: 0.20
    centered_effect_zero_mean_weight: 0.10
    centered_effect_scale_floor: 0.0001
    # Unlike classification/ranking, this is supervised regression to the
    # native artist-specific residual and should shape the head from the start.
    centered_effect_residual_start_step: 0
    centered_effect_residual_ramp_steps: 100
    # Native artist effects below this RMS are weak-query noise and must not
    # receive an inverse-scale weight larger than meaningful interventions.
    effect_scale_floor: 0.001
    freeze_base_connector: true
    primary_effect_initial_weight: 1.0
    primary_effect_weight: 0.10
    warmup_steps: 400
    minimum_lr_ratio: 0.1
    weight_decay: 0.01
    direction_weight: 0.2
    magnitude_weight: 0.02
    functional_rank_weight: 0.10
    functional_rank_margin: 0.02
    functional_contrastive_weight: 0.20
    functional_contrastive_temperature: 0.10
    # Give direct native-residual regression enough time to align the head
    # before classification/ranking objectives compete with reconstruction.
    functional_contrastive_start_step: 1500
    functional_contrastive_ramp_steps: 1000
