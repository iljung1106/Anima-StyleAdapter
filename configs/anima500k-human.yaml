# Full-data StyleTokenizer training from a fresh initialization. Ordinary
# ProductionStyleLoader references always exclude the target. Two disjoint
# views of each artist's references supervise the token set directly; a weak,
# delayed correct-vs-wrong direction objective emphasizes artist-specific flow.
style_tokenizer_generalization:
  output_directory: style_tokenizer_native_context_16_multiref_contrastive_8k_v1
  seed: 20260818
  train_split: train
  validation_split: validation
  loader:
    batch_size: 4
    min_references: 1
    max_references: 8
    artist_balanced: true
    self_reference_target_images_per_style: 0
    text_conditioning_length: 512
    text_lru_shards: 2
    latent_lru_shards: 2
    resampler_token_cache: production_resampler_tokens_l18_l24_siglip_l24
  model:
    source_dim: 1024
    context_dim: 1024
    output_tokens: 16
    bottleneck_dim: 512
    score_hidden_dim: 256
    output_rms_init: 0.15
  training:
    device: cuda
    reference_mode: heldout
    steps: 16000
    learning_rate: 0.0001
    betas: [0.9, 0.999]
    adam_eps: 0.00000001
    weight_decay: 0.01
    warmup_steps: 200
    minimum_lr_ratio: 0.20
    # Resume the completed 8k run without the LR jump that would result from
    # recomputing its original cosine schedule against a new 16k endpoint.
    continuation_start_step: 8000
    continuation_learning_rate: 0.00002
    max_grad_norm: 1.0
    gradient_accumulation_steps: 4
    fused_adamw: true
    allow_tf32: true
    low_precision_rmsnorm: true
    fuse_attention_projections: true
    timestep_sampling: shift
    sigmoid_scale: 1.0
    sigmoid_bias: 0.0
    discrete_flow_shift: 3.0
    prefetch_workers: 2
    prefetch_batches: 4
    token_contrastive_weight: 0.00075
    token_contrastive_temperature: 0.10
    token_contrastive_start_step: 1
    token_contrastive_ramp_steps: 1000
    artist_direction_weight: 0.00075
    artist_direction_start_step: 1500
    artist_direction_ramp_steps: 1000
    artist_direction_every: 4
    artist_direction_batch_size: 2
    artist_direction_margin: 0.02
    artist_centered_direction_weight: 0.25
    log_every: 10
    validation_every: 250
    validation_batches: 8
    train_validation_batches: 8
    checkpoint_every: 250
    sample_every: 500
    # Twelve consecutive 250-step validations (3k steps) are required before
    # declaring the continuation stagnant. The score combines heldout flow,
    # correct-vs-wrong advantage, and a smaller self term.
    early_stop_start_step: 8000
    early_stop_patience: 12
    early_stop_min_delta: 0.00025
    resume: true
    wandb:
      enabled: true
      project: anima-style-adapter
      name: style-tokenizer-native-context-16-multiref-contrastive-8k-v1
      id: style-tokenizer-native-context-16-multiref-contrastive-8k-v1
  sampling:
    width: 768
    height: 768
    steps: 30
    flow_shift: 3.0
    seed: 20260818
    text_cfg: 4.0
    guidance_mode: shared

# High-capacity StyleTokenizer v2.  Every reference keeps 32 independently
# queried tokens until the set-pooling stage; no single global descriptor is
# formed.  The resulting 32x1024 context enters a separate Same-Q style
# attention in every Anima block. Native K/V initialize the style projections,
# only rank-32 deltas are trained, and Anima's full-rank O is shared with text.
query_style_tokenizer_v2:
  output_directory: query_style_tokenizer_v2_32slot_joint_20k_v1
  seed: 20260821
  train_split: train
  validation_split: validation
  loader:
    # H100 real-Anima benchmark: batch 4 reached 5.84 images/s versus 3.49
    # images/s for batch 2, while completing forward/backward and validation.
    batch_size: 4
    min_references: 1
    max_references: 8
    artist_balanced: true
    self_reference_target_images_per_style: 0
    text_conditioning_length: 512
    text_lru_shards: 2
    latent_lru_shards: 2
    resampler_token_cache: production_resampler_tokens_l18_l24_siglip_l24
  model:
    source_dim: 1024
    context_dim: 1024
    source_tokens: 128
    output_tokens: 32
    heads: 16
    per_reference_layers: 3
    per_reference_ff_dim: 2048
    cross_slot_layers: 2
    cross_slot_ff_dim: 4096
    reconstruction_layers: 1
    reconstruction_ff_dim: 2048
    reference_score_dim: 256
    output_rms_init: 0.15
  adapter:
    architecture: same_q_full_rank
    style_dim: 1024
    context_dim: 1024
    slots: 32
    heads: 16
    blocks: 28
    alpha_init: 1.0
    style_dropout: 0.0
    aggregator_mode: minimal
    aggregator_bottleneck: 64
    connector_layers: 0
    connector_heads: 16
    bridge_init: xavier
    bridge_output_rms_init: 0.15
    style_kv_delta_rank: 32
    style_output_delta_rank: 0
    style_attention_context_length: 32
  training:
    device: cuda
    steps: 20000
    learning_rate: 0.0001
    kv_learning_rate: 0.00005
    betas: [0.9, 0.999]
    adam_eps: 0.00000001
    weight_decay: 0.01
    warmup_steps: 500
    minimum_lr_ratio: 0.10
    max_grad_norm: 1.0
    gradient_accumulation_steps: 4
    fused_adamw: true
    allow_tf32: true
    low_precision_rmsnorm: true
    fuse_attention_projections: true
    timestep_sampling: shift
    sigmoid_scale: 1.0
    sigmoid_bias: 0.0
    discrete_flow_shift: 3.0
    prefetch_workers: 2
    prefetch_batches: 4
    # 0-2k exact target; 2k-8k target inclusion 1.0->0.5 with 1-4 refs;
    # 8k-20k inclusion 0.5->0 with 1-8 target-excluded references.
    curriculum:
      gate_only_steps: 0
      self_reference_steps: 2000
      target_mix_end_step: 8000
      target_mix_end_probability: 0.5
      target_mix_min_references: 1
      target_mix_max_references: 4
      target_anneal_end: 20000
      target_anneal_min_references: 1
      target_anneal_max_references: 8
    # Reconstruction is deliberately auxiliary: it protects visual detail in
    # each reference's 32 slots but decays as flow and artist alignment mature.
    reconstruction_weight: 0.02
    reconstruction_final_weight: 0.005
    reconstruction_decay_steps: 8000
    reconstruction_huber_beta: 0.1
    artist_contrastive_weight: 0.01
    artist_contrastive_temperature: 0.10
    artist_contrastive_every: 2
    slot_diversity_weight: 0.001
    # Calibrate a noticeable but non-destructive style branch once, then keep
    # alpha fixed so shrinking the branch cannot solve the training objective.
    alpha_calibration_batches: 2
    alpha_target_style_to_text_ratio: 0.25
    alpha_minimum: 0.00001
    alpha_maximum: 1.0
    train_alpha: false
    log_every: 10
    validation_every: 250
    validation_batches: 8
    checkpoint_every: 500
    sample_every: 500
    resume: true
    wandb:
      enabled: true
      project: anima-style-adapter
      # The sampler retrofit intentionally resumed from step 500 after the
      # original run had already logged through step 740. W&B rejects
      # out-of-order explicit steps, so keep that pilot intact and record the
      # reproducible resume branch under its own run identity.
      name: query-style-tokenizer-v2-32slot-resume500-samples-v1
      id: query-style-tokenizer-v2-32slot-resume500-samples-v1
  sampling:
    width: 768
    height: 768
    steps: 30
    flow_shift: 3.0
    seed: 20260821
    text_cfg: 4.0
    style_cfg: 1.0
    batch_size: 4
    vae_batch_size: 4

# Phase T: the same high-capacity 32x1024 query tokenizer, but its output is
# inserted directly after each prompt's real text tokens. Frozen Anima then
# uses one native Q/K/V/O attention over text and style tokens together. There
# is no separate style branch, alpha, gate, bridge, or trainable Anima weight.
pure_token_style_tokenizer_v2:
  output_directory: pure_token_style_tokenizer_v2_32slot_20k_v1
  seed: 20260822
  train_split: train
  validation_split: validation
  loader:
    batch_size: 4
    min_references: 1
    max_references: 8
    artist_balanced: true
    self_reference_target_images_per_style: 0
    text_conditioning_length: 512
    text_lru_shards: 2
    latent_lru_shards: 2
    resampler_token_cache: production_resampler_tokens_l18_l24_siglip_l24
  model:
    source_dim: 1024
    context_dim: 1024
    source_tokens: 128
    output_tokens: 32
    heads: 16
    per_reference_layers: 3
    per_reference_ff_dim: 2048
    cross_slot_layers: 2
    cross_slot_ff_dim: 4096
    reconstruction_layers: 1
    reconstruction_ff_dim: 2048
    reference_score_dim: 256
    output_rms_init: 0.15
  training:
    device: cuda
    steps: 20000
    learning_rate: 0.0001
    betas: [0.9, 0.999]
    adam_eps: 0.00000001
    weight_decay: 0.01
    warmup_steps: 500
    minimum_lr_ratio: 0.10
    max_grad_norm: 1.0
    gradient_accumulation_steps: 4
    fused_adamw: true
    allow_tf32: true
    low_precision_rmsnorm: true
    fuse_attention_projections: true
    timestep_sampling: shift
    sigmoid_scale: 1.0
    sigmoid_bias: 0.0
    discrete_flow_shift: 3.0
    prefetch_workers: 2
    prefetch_batches: 4
    curriculum:
      gate_only_steps: 0
      self_reference_steps: 2000
      target_mix_end_step: 8000
      target_mix_end_probability: 0.5
      target_mix_min_references: 1
      target_mix_max_references: 4
      target_anneal_end: 20000
      target_anneal_min_references: 1
      target_anneal_max_references: 8
      # Favor the common one-reference use case while retaining enough
      # multi-reference exposure to teach evidence aggregation.
      reference_count_weights: [0.40, 0.25, 0.12, 0.08, 0.05, 0.04, 0.03, 0.03]
    # Standard flow MSE remains the primary objective. These target-conditioned
    # auxiliaries prevent the already-good frozen base from making a near-zero
