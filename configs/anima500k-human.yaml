    separated_component_bootstrap:
      enabled: false
      common_steps: 500
      artist_steps: 1500
      common_objective_weight: 1.0
      artist_objective_weight: 1.0
      # Frozen Common already represents the native global mean. Do not push
      # that reference-independent direction back into Artist K/V.
      # In combined mode this is the isolated native-common objective weight;
      # it no longer backpropagates through Artist.
      artist_mean_weight: 1.0
      common_transition:
        enabled: true
        minimum_steps: 500
        cosine: 0.70
        projection: 0.50
        rms_lower: 0.70
        rms_upper: 1.30
        consecutive_validations: 2
      common_objective:
        common_direction_weight: 1.0
        # Common direction remains learned, while its final velocity RMS is
        # held in a tight frozen-native band.
        magnitude_weight: 1.0
        magnitude_floor_start_step: 1
        magnitude_floor_end_step: 1
        magnitude_floor_start: 0.90
        magnitude_floor_end: 0.90
        magnitude_upper: 1.10
        magnitude_upper_weight: 1.0
      artist_objective:
        artist_direction_weight: 1.0
        magnitude_weight: 0.10
        magnitude_floor_start_step: 1
        magnitude_floor_end_step: 2500
        magnitude_floor_start: 0.25
        magnitude_floor_end: 0.75
        magnitude_upper: 1.50
        magnitude_upper_weight: 0.25
    gradient_accumulation_steps: 4
    # Native teacher updates run Common-only and Artist-only forwards. This
    # prevents either branch from learning to cancel the other.
    train_common_in_combined: true
    separated_teacher_gradients: true
    fused_adamw: true
    allow_tf32: true
    low_precision_rmsnorm: true
    fuse_attention_projections: true
    timestep_sampling: shift
    sigmoid_scale: 1.0
    sigmoid_bias: 0.0
    discrete_flow_shift: 3.0
    native_effect_timestep_weighting:
      enabled: true
      exponent: 1.0
      minimum: 0.75
      maximum: 1.33
      statistics_chunk_artists: 16
    reference_schedule:
      - name: exact_single
        end_step: 250
        min_references: 1
        max_references: 1
        reference_count_weights: [1.0]
      - name: target_included_1_2_4
        end_step: 1500
        min_references: 1
        max_references: 4
        reference_count_weights: [0.70, 0.25, 0.0, 0.05]
      - name: target_anneal_1_2_4_8
        end_step: 8000
        min_references: 1
        max_references: 8
        reference_count_weights: [0.55, 0.30, 0.0, 0.10, 0.0, 0.0, 0.0, 0.05]
    curriculum:
      gate_only_steps: 0
      self_reference_steps: 250
      target_mix_end_step: 750
      # v33 kept the exact target in every reference set through step 1,000.
      # The Reader then learned a strong reference-insensitive transform: its
      # centered InfoNCE improved while fixed-reference outputs converged. Start
      # removing the target immediately after the exact-self bootstrap.
      target_mix_end_probability: 0.8
      target_anneal_end: 8000
      target_mix_min_references: 1
      target_mix_max_references: 4
      target_anneal_min_references: 1
      target_anneal_max_references: 8
    empty_prompt_forces_target: true
    # Weakly preserve the random Reader's 84 -> 28 information path without
    # turning reconstruction into the style objective.
    reconstruction_weight: 0.005
    reconstruction_final_weight: 0.005
    reconstruction_hold_steps: 2000
    # v23 removes the failed v22 full-residual RMS bootstrap. The complete
    # target-minus-frozen residual contains content/noise/base-model error that
    # cannot be recovered from a lossy style reference; forcing its norm made
    # a nearly orthogonal delta accumulate as cracked high-frequency texture.
    main_flow_projection_weight: 0.0
    main_flow_magnitude_start_step: 1
    main_flow_magnitude_full_step: 1
    main_flow_magnitude_every: 1
    main_flow_magnitude_weight: 0.0
    main_flow_magnitude_target_ratio: 1.0
    main_flow_magnitude_huber_beta: 0.10
    main_flow_magnitude_scale_floor: 0.0001
    # Every fourth optimizer step, different artists share one x_t, timestep,
    # prompt and frozen-Anima Q. The centered RMS band is active from the
    # beginning; disjoint-view functional InfoNCE starts once exact-self ends.
    controlled_artist_every: 4
    controlled_exact_self_end_step: 250
    controlled_magnitude_start_step: 1
    controlled_magnitude_full_step: 500
    controlled_magnitude_weight: 0.05
    controlled_magnitude_lower_start_step: 1
    controlled_magnitude_lower_end_step: 500
    controlled_magnitude_lower_start: 0.25
    controlled_magnitude_lower_end: 0.50
    controlled_magnitude_upper: 1.25
    controlled_magnitude_upper_weight: 0.10
    controlled_contrastive_start_step: 251
    controlled_contrastive_full_step: 500
    controlled_contrastive_weight: 0.0
    controlled_contrastive_temperature: 0.10
    controlled_contrastive_pool_scales: [2, 4]
    controlled_repeatability_weight: 0.0
    # Legacy main-flow ranking is disabled below. The controlled frozen
    # teacher-direction ranking is configured beside the post-gate objective.
    functional_start_step: 250
    functional_full_step: 750
    functional_every: 1
    functional_margin: 0.01
    # v17 ranks correct vs cyclic-wrong frozen artist directions in the
    # controlled teacher batch. Disable noisy main-flow ranking and its extra
    # wrong-reference backward path.
    functional_weight: 0.0
    functional_wrong_gradient_scale: 0.0
    functional_wrong_gradient_every: 1
    # Two disjoint heldout reference sets share x_t/timestep/prompt/Q. Replace
    # the unbounded symmetric InfoNCE contraction with an all-wrong functional
    # margin and only a weak corresponding-view similarity floor.
    artist_effect_domains: [anima]
    artist_effect_start_step: 250
    artist_effect_full_step: 500
    # The centered objective is invariant to a shared output, so run the human
    # disjoint-view objective densely enough that artist-specific directions do
    # not become a sparse correction to ordinary flow MSE.
    artist_effect_every: 2
    artist_effect_weight: 0.05
    artist_effect_teacher_view: disjoint_heldout
    # The primary loss is backwarded before the auxiliary heldout-reference
    # Anima pass, so two batch-four DiT graphs never coexist on an H100 80GB.
    artist_effect_temperature: 0.10
    artist_effect_pool_scales: [2, 4]
    artist_effect_contrastive_mode: all_wrong_margin
    artist_effect_wrong_margin: 0.10
    artist_effect_positive_floor: 0.25
    artist_effect_repeatability_weight: 0.02
    artist_effect_repeatability_floor: null
    # Estimate the common residual directly under a controlled same-content /
    # timestep native-teacher probe. Normalize only by the frozen native effect
    # scale; no cross-step EMA or student-derived denominator is used.
    common_output_start_step: 250
    common_output_full_step: 500
    # At v33 step 1,000 the weighted common term was only 7.95e-4 while the
    # common-output ratio rose to 0.894. Give the raw (uncentered) artist mean
    # enough weight to constrain the null-centered Artist path without forcing
    # an unrealistically zero mean from a four-artist batch.
    common_output_weight: 0.0
    common_output_teacher: student_batch
    common_output_native_ratio_threshold: 0.60
    artist_energy_native_ratio_floor: 0.50
    # Raise artist-centered energy instead of trying to obtain diversity only
    # by suppressing the batch mean. This reuses the existing controlled pass.
    artist_energy_weight: 0.0
    # Apply the same frozen-native-normalized common-effect constraint to
    # ordinary human training artists. Four artists share one main-batch
    # x_t/timestep/content probe, so their mean residual is functionally valid.
    # This pass is sequential after the main backward to bound peak VRAM.
    main_common_output_start_step: 250
    main_common_output_full_step: 750
    main_common_output_every: 4
    main_common_output_batch_rows: 4
    main_common_output_weight: 0.0
    main_common_output_native_ratio_threshold: 0.60
    main_artist_energy_native_ratio_floor: 0.50
    main_artist_energy_weight: 0.0
    common_output_threshold_start_step: 250
    common_output_threshold_end_step: 1500
    common_output_threshold_start: 0.80
    common_output_threshold_end: 0.55
    # Preserve only the artist component repeated by the other disjoint
    # heldout view. This deliberately avoids the complete target-minus-frozen
    # residual and its inaccessible content/noise components.
    artist_magnitude_teacher: disjoint_heldout
    artist_magnitude_start_step: 1
    artist_magnitude_full_step: 1000
    # Keep this band weak: it preserves a repeatable effect without making
    # magnitude more important than its direction or the main flow objective.
    artist_magnitude_weight: 0.01
    artist_magnitude_lower_start_step: 250
    artist_magnitude_lower_end_step: 2000
    artist_magnitude_lower_start: 0.35
    artist_magnitude_lower_end: 0.70
    artist_magnitude_upper: 1.25
    artist_magnitude_upper_weight: 0.25
    # A fixed type-wise summary of the 28 output tokens is classified against
    # prototypes built only from a disjoint view of the same artist.
    artist_prototype_start_step: 250
    artist_prototype_full_step: 1000
    artist_prototype_every: 2
    artist_prototype_weight: 0.0
    artist_prototype_temperature: 0.10
    artist_prototype_slot_type_counts: [16, 8, 4]
    artist_effect_validation_batches: 2
    artist_effect_validation_timesteps: [0.2, 0.45, 0.7, 0.9]
    # Sixteen artists share the same x_t/timestep/content/Q. Frozen DiT
    # forwards are split into four-row microbatches; InfoNCE still sees all 15
    # wrong artists and common-output uses the exact sixteen-row mean.
    teacher_batch_rows: 16
    teacher_microbatch_rows: 4
    teacher_references: 4
    # Keep the first teacher updates at four references, then continuously ramp
    # toward the low-reference distribution used by the human curriculum.
    teacher_reference_count_weights: [0.0, 0.0, 0.0, 1.0]
    teacher_reference_count_curriculum:
      start_step: 1
      end_step: 1000
      before_weights: [0.0, 0.0, 0.0, 1.0]
      start_weights: [0.0, 0.0, 0.0, 1.0]
      end_weights: [0.50, 0.30, 0.0, 0.20]
    teacher_every_step_until: 250
    # Synthetic artist-tag alignment is useful initialization, but v33 let it
    # share every functional update after step 250. Human reference separation
    # is now the denser objective.
    teacher_every_after_bootstrap: 4
    teacher_end_step: 8000
    # Native @artist distillation aligns the Anima-facing K/V path.  Human flow
    # remains the main signal that may preserve reference-specific content;
    # do not let the class-level teacher compress the Reader into an invariant
    # artist representation.
    teacher_reader_gradient_scale: 0.10
    # Local block-output regression is intentionally disabled. Native tagged
    # contexts are used only to recover the final global common effect removed
    # by the pre-centered teacher cache.
    post_gate_teacher_distillation:
      enabled: false
    # Same controlled Student effects are ranked against matching and
    # cyclic-shifted frozen artist directions. Only Student correct-direction
    # scores receive gradients; wrong artists are never trained to deteriorate.
    teacher_direction_ranking_start_step: 1
    teacher_direction_ranking_full_step: 250
    teacher_direction_ranking_weight: 0.0
    teacher_direction_ranking_margin: 0.10
    # Cover the complete 4-content x 8-timestep teacher grid once. Each of the
    # 28 blocks receives four independent alpha values which are linearly
    # interpolated at runtime. Native median is the aligned lower target and
    # 1.5 x native P95 is the weak total-RMS cap.
    alpha_calibration_batches: 32
    alpha_calibration_timestep_bin_edges: [0.0, 0.325, 0.625, 0.86, 1.000001]
    alpha_calibration_minimum: 0.000001
    alpha_calibration_maximum: 8.0
    # Alpha calibration is initialization only. Do not renormalize every
    # forward: the aligned projection floor must retain a radial gradient.
    fixed_output_quantile: null
    # This bootstrap has no competing main-flow or per-block teacher backward.
    # The outer factor keeps the four final-component objectives in a stable
    # optimizer range.
    teacher_global_weight: 0.25
    # Every controlled row is contrasted against all other frozen artists.
    teacher_infonce_weight: 0.0
    # A single lossy view needs stronger discrimination from the frozen
    # sixteen-artist bank than a stable four-view estimate.
    teacher_infonce_weight_by_reference_count: [0.0, 0.0, 0.0, 0.0]
    teacher_infonce_temperature: 0.10
    # Legacy zero-common suppression is absent. One native tagged final forward
    # per cached content/timestep recovers the global common component exactly:
    # raw native effect minus the stored globally-centered artist effect.
    teacher_objective:
      # The only reconstruction targets are the final common and centered
      # artist directions. Absolute full/low-frequency residual regression is
      # deliberately absent because the two attention paths are not locally
      # identifiable and the visual reference is lossy.
      artist_direction_weight: 1.0
      common_direction_weight: 1.0
      native_teacher_scale_floor: 0.0001
      native_strength_weighting: true
      native_strength_weight_min: 0.25
      native_strength_weight_max: 4.0
      magnitude_weight: 0.10
      magnitude_floor_start_step: 1
      magnitude_floor_end_step: 750
      magnitude_floor_start: 0.25
      magnitude_floor_end: 0.75
      magnitude_upper: 1.50
      magnitude_upper_weight: 0.25
    # Do not lower target inclusion or teacher density merely because a step
    # boundary was crossed. Each transition needs three consecutive validation
    # windows satisfying every criterion below.
    performance_curriculum:
      enabled: false
      stages:
        - name: direction_bootstrap_exact_self
          min_references: 1
          max_references: 1
          reference_count_weights: [1.0]
          target_only: true
          target_probability: 1.0
          teacher_every: 1
          post_gate_magnitude_enabled: false
          advance:
            # v19 reached a stable exact-self improvement and separated all
            # 16 teacher artists by step 2k, while the positive native-axis
            # coefficient plateaued near 0.22. Requiring 0.40 kept training
            # on target-only references after the bootstrap task was already
            # solved and delayed the heldout-reference objective indefinitely.
            minimum_step: 2000
            final_centered_cosine: 0.30
            native_projection: 0.20
            common_output_ratio: 0.62
            consecutive_validations: 2
        - name: aligned_target_mix_1_2_4
          min_references: 1
          max_references: 4
          reference_count_weights: [0.50, 0.35, 0.0, 0.15]
          target_only: false
          target_probability: 0.65
          teacher_every: 1
          post_gate_magnitude_enabled: true
          advance:
            # Keep this mixed target/reference phase for roughly 2k updates
            # after the expected stage-0 transition. Direction must survive
            # lossy cross-reference inputs; it need not grow to an unattained
            # target-only coefficient before fully heldout training begins.
            minimum_step: 4000
            final_centered_cosine: 0.30
            native_projection: 0.20
            common_output_ratio: 0.65
            consecutive_validations: 3
        - name: aligned_heldout_1_2_4_8
          min_references: 1
          max_references: 8
          reference_count_weights: [0.45, 0.30, 0.0, 0.17, 0.0, 0.0, 0.0, 0.08]
          target_only: false
          target_probability: 0.0
          teacher_every: 2
          post_gate_magnitude_enabled: true
    prefetch_workers: 2
    prefetch_batches: 6
    log_every: 10
    validation_every: 250
    validation_batches: 8
    state_every: 250
    checkpoint_every: 250
    sample_every: 500
    fixed_sample_every: 250
    fixed_sample_strengths: [1.0, 2.0]
    # Diagnose whether the frozen Common scaffold or the trained Artist path
    # dominates the visually similar v34 fixed-reference outputs.
    fixed_sample_backfill_steps: []
    fixed_sample_backfill_component_modes: []
    fixed_sample_backfill_strengths: [1.0, 2.0]
    resume: true
    wandb:
      enabled: true
      project: anima-style-adapter
      name: detail-style-v37b-v34-diversity-warmstart
      id: detail-style-v37b-v34-diversity-warmstart
  gradient_diagnostics:
    checkpoint_step: 1500
    teacher_batch_step: 1500
    batch_size: 4
    content_index: 0
    timestep_index: 3
    gradient_samples_per_group: 131072
    candidate_absolute_direction_weight: 0.10
