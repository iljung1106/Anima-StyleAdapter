    direction_weight: 0.0
    magnitude_weight: 0.0
    functional_rank_weight: 0.0
    functional_rank_margin: 0.02
    functional_contrastive_weight: 0.0
    functional_contrastive_temperature: 0.10
    # The 64-artist capacity probe reached 13.67% held-content all-pairs
