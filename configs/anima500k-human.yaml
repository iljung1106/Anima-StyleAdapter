# Cross-modal bootstrap corpus: 500 train artists × eight shared content prompts
# × two shared seeds. Seven prompts explicitly contain 1girl. The 16 matching
# artist-free images provide paired content controls. Text conditions, generated latents/images, and selected
# C-RADIO features are all resumable caches under one directory.
synthetic_teacher:
  output_directory: synthetic_teacher_500x16
  device: cuda
  seed: 20260812
  artist_count: 500
  contents_per_artist: 8
  female_contents: 7
  seeds_per_content: 2
  width: 512
  height: 512
  steps: 20
  text_cfg: 4.0
  flow_shift: 3.0
  batch_size: 8
  text_batch_size: 64
  text_shard_rows: 128
  latent_shard_rows: 256
  image_writer_workers: 8
  webp_quality: 95
  sage_attention: true
  torch_compile: true
  compile_mode: reduce-overhead
  speed:
    enabled: true
    transform: dct
    scales: [0.5, 1.0]
    manual_sigmas: [0.85]
  benchmark:
    images: 16
    baseline_batch_size: 1
    candidate_batch_sizes: [4, 8, 12]
    require_finite: true
  negative_prompt: worst quality, low quality, score_1, score_2, score_3, blurry, jpeg artifacts, sepia
  bootstrap:
    split_seed: 20260812
    validation_artists: 25
    meta_test_artists: 25
    # Exactly two of eight contents are held out: one for validation and one
    # for the final content-disjoint meta-test.
    heldout_contents: [6, 7]
    image_validation_workers: 32
    image_decode_samples: 128
    feature_reduction_device: cuda
    feature_reduction_batch_size: 64
    cpu_threads: 8
  query_probes:
    seed: 20260812
    trajectories_per_content: 8
    timesteps: [0.15, 0.35, 0.65, 0.85]
    queries_per_block: 32
  style_token_cache:
    output_directory: resampler_tokens_artist_specific_stage_r_v1
    batch_size: 16
  offline_bootstrap:
    # Stage A0: align only the Resampler->Anima bridge and the centered
    # query-conditioned artist head. The common connector and all K/V/O deltas
    # are frozen so a reference-independent mean artist effect cannot solve the
    # objective.
    output_directory: offline_artist_specific_stage_a0_v3
    seed: 20260812
    steps: 8000
    batch_size: 16
    blocks_per_step: 7
    # The centered objective is evaluated only on functional blocks. Use all
    # sampled blocks so every step supplies seven times more A0 supervision.
    functional_blocks_per_step: 7
    gpu_resident_small_caches: true
    style_token_directory: resampler_tokens_artist_specific_stage_r_v1
    representation_warmup_steps: 0
    centered_effect_head: true
    centered_effect_latent_dim: 512
    centered_effect_learning_rate: 0.0001
    centered_effect_max_grad_norm: 0.50
    centered_effect_residual_weight: 1.0
    centered_effect_direction_weight: 0.20
    centered_effect_zero_mean_weight: 0.10
    centered_effect_scale_floor: 0.0001
    centered_effect_residual_start_step: 0
    centered_effect_residual_ramp_steps: 200
    centered_target_native_only: true
    freeze_base_connector: true
    # Base connector losses are disabled in A0. These LR values are retained
    # only as explicit documentation of the frozen groups.
    primary_effect_initial_weight: 0.0
    primary_effect_weight: 0.0
    learning_rate: 0.0
    connector_learning_rate: 0.0
    bridge_learning_rate: 0.0
    warmup_steps: 400
    minimum_lr_ratio: 0.1
    weight_decay: 0.01
