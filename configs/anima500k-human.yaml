# Hierarchical successor to the flat 84R-token Set Decoder. Every reference is
# read independently into aligned slots before references are pooled. The run
# is target-excluded from step one and injects 16 unconstrained native-context
# tokens through frozen Anima's original K/V/O path.
hierarchical_dual_query_style_tokenizer:
  output_directory: hierarchical_dual_query_style_tokenizer_v1_10k
  seed: 20260816
  train_split: train
  validation_split: validation
  resampler_checkpoint: dual_query_resampler_bprime_v8/checkpoints/step-010000.pt
  cache:
    output_directory: dual_query_reference_tokens_v8_step10000
  loader:
    batch_size: 4
    min_references: 1
    max_references: 8
    artist_balanced: true
    self_reference_target_images_per_style: 0
    text_conditioning_length: 512
    text_lru_shards: 4
    latent_lru_shards: 4
    token_lru_shards: 8
  model:
    architecture: hierarchical
    dim: 1024
    spatial_tokens: 64
    global_tokens: 16
    artist_summary_tokens: 4
    include_artist_summary: true
    output_tokens: 16
    heads: 16
    per_reference_layers: 1
    per_reference_ff_dim: 4096
    reference_score_dim: 256
    reconstruction_layers: 1
    reconstruction_ff_dim: 2048
    initial_output_rms: 0.15
  training:
    device: cuda
    steps: 10000
    learning_rate: 0.0001
    betas: [0.9, 0.999]
    adam_eps: 0.00000001
    weight_decay: 0.01
    warmup_steps: 500
    minimum_lr_ratio: 0.10
    max_grad_norm: 1.0
    gradient_accumulation_steps: 4
    fused_adamw: true
    allow_tf32: true
    low_precision_rmsnorm: true
    fuse_attention_projections: true
    timestep_sampling: shift
    sigmoid_scale: 1.0
    sigmoid_bias: 0.0
    discrete_flow_shift: 3.0
    prefetch_workers: 2
    prefetch_batches: 6
    resume: true
    wandb_run_revision: -r2
    pilot_enabled: true
    # No stage contains the target image. The first 500 steps emphasize one or
