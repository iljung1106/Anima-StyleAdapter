    aligned_floor_ramp_steps: 500
    reconstruction_weight: 0.02
    reconstruction_final_weight: 0.005
    reconstruction_decay_steps: 8000
    reconstruction_huber_beta: 0.10
    artist_contrastive_weight: 0.01
    artist_contrastive_temperature: 0.10
    artist_contrastive_every: 2
    slot_diversity_weight: 0.001
    log_every: 10
    validation_every: 250
    validation_batches: 8
    checkpoint_every: 500
    sample_every: 500
    external_sample_every: 1000
    resume: true
    wandb:
      enabled: true
      project: anima-style-adapter
      # Resume the exact step-4000 optimizer/RNG state in a fresh W&B run;
      # the prior run contains post-checkpoint logs that must not be rewound.
      name: pure-token-style-tokenizer-v2-32slot-resume4000-external-samples-v1
      id: pure-token-style-tokenizer-v2-32slot-resume4000-external-samples-v1
