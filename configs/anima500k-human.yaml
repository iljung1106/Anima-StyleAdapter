    reconstruction_weight: 0.010
    reconstruction_final_weight: 0.005
    reconstruction_decay_steps: 10000
    reconstruction_huber_beta: 0.10
    reconstruction_cosine_weight: 0.25
    artist_contrastive_weight: 0.005
