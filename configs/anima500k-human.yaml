    # hard negatives early enough to shape unseen-artist generalization.
    functional_contrastive_start_step: 250
    functional_contrastive_ramp_steps: 750
    functional_all_pairs_weight: 0.0
    functional_centered_all_pairs_weight: 0.20
    functional_centered_temperature: 0.07
    centered_pair_head_only: true
    target_excluded_start_step: 0
    target_excluded_end_step: 1
    exact_self_probability: 0.0
    checkpoint_full_effect_weight: 0.0
    checkpoint_full_cosine_weight: 0.0
    checkpoint_centered_cosine_weight: 1.0
    checkpoint_centered_accuracy_weight: 0.25
    checkpoint_discrimination_weight: 0.0
    log_every: 20
    validation_every: 250
    validation_batches: 16
    train_heldout_batches: 16
    meta_test_batches: 16
    checkpoint_every: 500
    minimum_steps: 2000
    early_stop_patience: 12
    resume: false
    wandb:
      enabled: true
      project: anima-style-adapter
      name: offline-artist-specific-stage-a0-v3
      id: offline-artist-specific-stage-a0-v3
    capacity_probe:
