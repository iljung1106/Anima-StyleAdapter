    # geometry that collapsed reference diversity and must not be reused.
    resume_optimizer: false
    reset_artist_null_context_on_upgrade: true
    betas: [0.9, 0.95]
    adam_eps: 0.00000001
    weight_decay: 0.01
    warmup_steps: 100
    lr_decay_start_step: 6000
    minimum_lr_ratio: 0.10
    max_grad_norm: 1.0
    reader_max_grad_norm: 1.0
    adapter_max_grad_norm: 1.0
    # Component bootstrapping is complete in v31. Combined mode freezes Common
