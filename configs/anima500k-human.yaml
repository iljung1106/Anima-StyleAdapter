      exact_projection_target_huber_beta: 0.10
      bounded_effect_every: 1
      exact_bounded_min: 0.08
      exact_bounded_max: 1.25
      exact_bounded_weight: 0.05
      bounded_orthogonal_maximum: 0.03
      bounded_orthogonal_weight: 0.25
      wrong_ranking_start_step: 3001
