output_dir: data/anima500k-human

anima500k:
  repo_id: ij/anima-style-embedding-500k-full-face
  revision: b8bf93dd0b1950576aa39e0467117b13812659dd
  source: human
  source_dir: source
  download_workers: 16
  extract_workers: 8

# Kept for the common pipeline configuration contract. Selection is already
# encoded in the source dataset; 50 candidates are retained before dedup.
metadata: {}
selection:
  artists: 5000
  images_per_artist: 30
  candidate_multiplier: 1.6666667
download: {}
dedup:
  workers: 16
  chunksize: 32
  phash_distance: 6
  dhash_distance: 6
  require_both_hashes: true
tagger:
  repo_id: ashen-sensored/wd-eva02-tagger-2026-canary
  revision: c45a59a3f17c0ca6066072b1c213e0c12a90e242
  architecture: eva02_large_patch14_448
  input_size: 448
  threshold: 0.6025
  score_store_threshold: 0.10
  sparse_top_k: 512
  batch_size: 32
  num_workers: 8
  device: cuda
  shard_rows: 2000
  content_exclude_tags: []

caption:
  version: anima-tags-v1
  rating_map:
    general: safe
    sensitive: sensitive
    questionable: nsfw
    explicit: explicit
  include_rating: true
  include_characters: true
  include_general: true

cradio:
  torchhub_repo: NVlabs/RADIO
  torchhub_ref: c0f37017930e9dda53f93424cf4bf39fc51f287e
  model_version: c-radio_v4-so400m
  adaptor_name: siglip2-g
  patch_size: 16
  max_side: 1024
  max_pixels: 1048576
  min_side: 16
  batch_size: 4
  device: cuda
  amp_dtype: bfloat16
  storage_dtype: float16
  content_scale: 1.0
  normalize_residual: true
  shard_rows: 128

# Production cache selected by the 1,000-artist tap-resampler pilot. Keep the
# late spatial maps intact and retain only cheap low-level channel statistics.
style_features:
  spatial_layers: [20, 24]
  statistics_layers: [8]
  statistics: [mean, std]
  storage_dtype: float16
  amp_dtype: bfloat16
  batch_size: 4
  shard_rows: 128
  max_open_buckets: 64
  preprocess_workers: 8
  prefetch_images: 64
  preprocess:
    max_side: 512
    max_pixels: 262144

cradio_probe:
  seed: 20260810
  split: train
  style_count: 64
  images_per_style: 20
  reference_counts: [1, 2, 4, 8]
  layers: [4, 8, 12, 16, 20, 24, 26]
  content_scales: [0.5, 1.0, 1.5]
  batch_size: 4
  max_open_buckets: 16
  storage_dtype: float16
  preprocess:
    max_side: 512
    max_pixels: 262144

tap_resampler_experiment:
  seed: 20260810
  selected_variant: spatial_l20_l24
  source_split: train
  artist_count: 1000
  images_per_artist: 10
  val_artists: 100
  test_artists: 100
  reconstruction_taps: [8, 16, 24]
  reference_counts: [1, 2, 4, 8]
  features:
    layers: [8, 12, 16, 20, 24]
    storage_dtype: float16
    batch_size: 4
    shard_rows: 16
    max_open_buckets: 16
    preprocess:
      max_side: 512
      max_pixels: 262144
  training:
    device: cuda
    model_dim: 512
    latent_tokens: 16
    heads: 8
    resampler_layers: 4
    decoder_layers: 2
    style_dim: 256
    artists_per_batch: 8
    images_per_artist: 4
    steps: 2000
    learning_rate: 0.0002
    weight_decay: 0.01
    prototype_weight: 0.25
    prototype_ramp: 0.20
    temperature: 0.07
    huber_weight: 0.10
    max_grad_norm: 1.0
    evaluation_batch_size: 8
    prefetch_workers: 8
    prefetch_batches: 16
    log_every: 20
    checkpoint_every: 100
    force: false
  variants:
    - {name: spatial_l24, taps: [24], global: none}
    - {name: spatial_l12_l24, taps: [12, 24], global: none}
    - {name: spatial_l20_l24, taps: [20, 24], global: none}
    - {name: spatial_l8_l16_l24, taps: [8, 16, 24], global: none}
    - {name: spatial_l12_l20_l24, taps: [12, 20, 24], global: none}
    - {name: l12_l24_native_siglip_l24, taps: [12, 24], global: native_24}
    - {name: l8_l16_l24_native_siglip_l24, taps: [8, 16, 24], global: native_24}
    - {name: l12_l24_siglip_visual, taps: [12, 24], global: siglip_visual}
    - {name: l20_l24_native_siglip_l24, taps: [20, 24], global: native_24}
    - {name: l20_l24_siglip_visual, taps: [20, 24], global: siglip_visual}
