      checkpoint_every: 500
      validation_every: 63
      validation_batches: 1
      train_heldout_batches: 1
      warmup_steps: 400
      functional_contrastive_start_step: 1500
      functional_contrastive_ramp_steps: 1000
      wandb:
        enabled: true
        project: anima-style-adapter
        name: real-artist-reference-head-capacity-64-batch64
        id: real-artist-reference-head-capacity-64-batch64-v6
