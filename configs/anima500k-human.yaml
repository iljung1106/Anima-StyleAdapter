    dim: 1024
    slots: 28
    heads: 16
    ff_dim: 2048
    bottleneck_dim: 256
    learning_rate: 0.00020
    warmup_steps: 50
    checkpoint_every: 125
    log_every: 10
    max_grad_norm: 1.0
    fused_adamw: true
    weight_decay: 0.01
    betas: [0.9, 0.95]
    adam_eps: 0.00000001
    resume: true
    loss_weights:
      huber: 1.0
      raw_direction: 0.25
      centered_direction: 1.0
      centered_magnitude: 0.10
      infonce: 0.50
      identity: 0.01
      infonce_temperature: 0.10
    wandb:
      enabled: true
      project: anima-style-adapter
      name: lora-oracle-visual-projector-v6-256-broad12x6-clean
      id: lora-oracle-visual-projector-v6-256-broad12x6-clean
  functional_projector:
    output_directory: lora_oracle_functional_projector_v2_native_pretrain
    source_checkpoint: lora_oracle_bootstrap_v1/training_state.pt
    projector_checkpoint: lora_oracle_visual_projector_v3_materialized/training_state.pt
    steps: 2500
    native_pretrain_steps: 1500
    native_materialize_chunk_size: 128
    native_preload_workers: 16
    cpu_threads: 16
    batch_rows: 8
    materialized_reference_images: 8
    token_lru_shards: 512
    learning_rate: 0.00010
    warmup_steps: 50
    code_alignment_weight: 0.10
    native_identity_weight: 0.001
    checkpoint_every: 250
    sample_every: 250
    log_every: 10
    max_grad_norm: 1.0
    fused_adamw: true
    weight_decay: 0.01
    betas: [0.9, 0.95]
    adam_eps: 0.00000001
    resume: true
    functional_loss_weights:
      huber: 1.0
      direction: 1.0
      magnitude: 0.25
      infonce: 0.5
      zero_mean: 0.25
      infonce_temperature: 0.10
    code_loss_weights:
      huber: 1.0
      raw_direction: 0.25
      centered_direction: 1.0
      centered_magnitude: 0.10
      infonce: 0.50
      identity: 0.01
      infonce_temperature: 0.10
    wandb:
      enabled: true
      project: anima-style-adapter
      name: lora-oracle-functional-projector-v2-native-pretrain
      id: lora-oracle-functional-projector-v2-native-pretrain
  joint_manifold:
    output_directory: lora_oracle_joint_manifold_v5_256_independent_kv
    source_checkpoint: lora_oracle_bootstrap_v5_256_independent_kv_hard_timestep/training_state.pt
    projector_checkpoint: lora_oracle_visual_projector_v6_256_broad12x6_clean/training_state.pt
    steps: 2000
    cpu_threads: 16
    batch_rows: 8
    native_batch_rows: 8
    materialized_reference_images: 8
    native_materialize_chunk_size: 128
    native_preload_workers: 16
    token_lru_shards: 512
    projector_learning_rate: 0.00010
    shared_learning_rate: 0.00001
    delta_learning_rate: 0.00002
    mix_learning_rate: 0.000005
    warmup_steps: 50
    oracle_replay_weight: 0.50
    code_alignment_weight: 0.05
    native_cross_view_weight: 0.10
    # Token-space separation alone can create directions that the frozen Anima
    # connector ignores.  Every other step, verify a small native batch after
    # the actual style path and keep its effect near the LoRA-teacher scale.
    native_functional_cross_view_weight: 0.05
    native_functional_cross_view_every: 2
    native_functional_cross_view_rows: 4
    native_functional_magnitude_weight: 0.10
    # Draw a random pool, then greedily spread the batch using the cached
