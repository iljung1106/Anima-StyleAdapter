  output_directory: synthetic_teacher_500x16
  device: cuda
  seed: 20260812
  artist_count: 500
  contents_per_artist: 8
  female_contents: 7
  seeds_per_content: 2
  width: 512
  height: 512
  steps: 20
  text_cfg: 4.0
  flow_shift: 3.0
  batch_size: 8
  text_batch_size: 64
  text_shard_rows: 128
  latent_shard_rows: 256
  image_writer_workers: 8
  webp_quality: 95
  sage_attention: true
