    validation_prompt_modes:
      full: 1.0
      tag_dropout: 0.0
      short: 0.0
      empty: 0.0
    validation_quality_probability: 0.0
  model:
    architecture: typed_multi_descriptor_compact
    dim: 1024
    spatial_tokens: 64
    global_tokens: 16
    artist_summary_tokens: 4
    include_artist_summary: true
    spatial_descriptors: 4
    global_descriptors: 2
    artist_descriptors: 2
    output_tokens: 16
    heads: 16
    ff_dim: 2048
    slot_modulation_scale: 0.25
    output_mode: grouped_mlp
    descriptor_group_size: 2
    group_bottleneck_dim: 512
    group_slot_embedding_scale: 0.0
    output_gain_center: 0.15
    output_gain_log_span: 0.50
    learnable_output_gain: false
  training:
    device: cuda
    steps: 4000
    learning_rate: 0.0001
    betas: [0.9, 0.999]
    adam_eps: 0.00000001
    weight_decay: 0.01
    warmup_steps: 400
    minimum_lr_ratio: 0.10
    # This is a 3k -> 4k gate, but preserve the LR trajectory of the planned
    # full 8k run instead of decaying to the minimum at the temporary gate.
    lr_schedule_total_steps: 8000
    max_grad_norm: 1.0
    gradient_accumulation_steps: 4
    fused_adamw: true
    allow_tf32: true
    low_precision_rmsnorm: true
    fuse_attention_projections: true
    timestep_sampling: shift
    sigmoid_scale: 1.0
    sigmoid_bias: 0.0
    discrete_flow_shift: 3.0
    prefetch_workers: 2
    prefetch_batches: 6
    resume: true
    initial_checkpoint: typed_multi_descriptor_grouped_8k_v5_full_teacher/checkpoints/step-0000750.pt
    initial_history: typed_multi_descriptor_grouped_8k_v5_full_teacher/history.json
    reset_optimizer_on_initial_checkpoint: false
    pilot_enabled: true
    reference_schedule:
      - name: target_excluded_1_8
        end_step: 8000
        exact_self: false
        min_references: 1
        max_references: 8
        reference_count_weights: [0.45, 0.25, 0.12, 0.07, 0.04, 0.03, 0.02, 0.02]
    exact_self_end_step: 0
    heldout_normalized_residual_weight: 0.0
    heldout_aligned_floor_weight: 0.0
    heldout_bounded_weight: 0.0
    exact_projection_target_weight: 0.0
    reconstruction_weight: 0.0
    reconstruction_final_weight: 0.0

    # Artist identity is learned only from the compact artist descriptors.
    artist_contrastive_weight: 0.002
    artist_contrastive_start_step: 250
    artist_contrastive_ramp_steps: 250
    artist_contrastive_temperature: 0.10
    artist_contrastive_every: 2
    token_contrastive_weight: 0.0
    subset_consistency_weight: 0.0

    # Do not directly match two jointly moving same-artist views: their easiest
    # solution is a shared functional output.  Use the probe only to preserve
    # artist-centered energy and suppress the batch-common Anima residual.
    functional_probe_enabled: true
    functional_probe_start_step: 500
    functional_probe_ramp_steps: 500
    functional_probe_every: 2
    functional_probe_batch_rows: 4
    functional_probe_references: 4
    same_artist_functional_weight: 0.0
    same_artist_functional_direction_fraction: 0.75
    same_artist_functional_huber_beta: 0.10
    same_artist_functional_center_across_artists: true
    centered_artist_effect_weight: 0.05
    functional_common_output_weight: 0.05

    # Structural slot identity is preferred over attention-map proxies. A
    # weak late diagnostic acts after actual Frozen-Anima K/V projection.
    slot_diversity_weight: 0.0
    attention_diversity_weight: 0.0
    reference_conditioned_diversity_weight: 0.0
    functional_value_diversity_weight: 0.0005
    functional_value_diversity_start_step: 3000
    functional_value_diversity_ramp_steps: 500
    functional_value_blocks: [4, 12, 20, 27]
    functional_value_slot_energy_floor: 0.08
    functional_value_reference_energy_floor: 0.02
    functional_value_decorrelation_fraction: 0.05
    context_rms_weight: 0.0

    # Do not floor total centered RMS: only the teacher-aligned projection is
    # rewarded, so orthogonal noise cannot satisfy the magnitude objective.
    center_student_teacher: true
    centered_energy_start_step: 1
    centered_energy_ramp_end_step: 1500
    centered_energy_ratio_start: 0.0
    centered_energy_ratio_end: 0.0
    centered_energy_ratio_maximum: 100.0
    centered_energy_weight: 0.0
    teacher_projected_effect_start_step: 1
    teacher_projected_effect_ramp_steps: 250
    teacher_projected_effect_weight: 1.00
    teacher_projection_floor_start_step: 1
    teacher_projection_floor_end_step: 1500
    teacher_projection_floor_start: 0.02
    teacher_projection_floor_end: 0.15
    teacher_projection_coefficient_maximum: 1.25
    teacher_projection_orthogonal_maximum: 0.50
    teacher_projection_orthogonal_weight: 0.25
    common_output_denominator: teacher_centered_rms
    common_output_weight: 0.50
    common_output_start_step: 1
    common_output_ramp_end_step: 250
    common_output_threshold_start: 0.65
    common_output_threshold_end: 0.55
    common_output_threshold_end_step: 2000
    artist_teacher_contrastive_weight: 0.01
    artist_teacher_contrastive_start_step: 750
    artist_teacher_contrastive_ramp_end_step: 1500
    artist_teacher_temperature: 0.07
    artist_teacher_ranking_weight: 0.005
    artist_teacher_ranking_start_step: 1000
    artist_teacher_ranking_ramp_end_step: 2000
    artist_teacher_ranking_margin: 0.10

    # Wrong-reference ranking remains off during the 2k gate. It is opened
    # only after useful heldout and teacher-aligned directions are observed.
    wrong_ranking_weight: 0.0005
    wrong_ranking_start_step: 3000
    wrong_ranking_ramp_steps: 1000
    wrong_ranking_every: 4
    wrong_ranking_batch_rows: 2
    wrong_ranking_margin: 0.02
    wrong_flow_ranking_margin: 0.01
    wrong_flow_ranking_weight: 1.0

    dual_domain_teacher_schedule:
      - {end_step: 1000, every: 1}
