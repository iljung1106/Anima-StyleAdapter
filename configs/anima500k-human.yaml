    exact_self_end_step: 0
    heldout_normalized_residual_weight: 0.0
    heldout_aligned_floor_weight: 0.0
    heldout_bounded_weight: 0.0
    exact_projection_target_weight: 0.0
    reconstruction_weight: 0.0
    reconstruction_final_weight: 0.0
    artist_contrastive_weight: 0.0
    token_contrastive_weight: 0.0
    slot_diversity_weight: 0.0002
    subset_consistency_weight: 0.0
    wrong_ranking_weight: 0.0
    functional_probe_enabled: false
