# Styled-reference-only direct native text K/V residual training.  All 320
# K/V-only LoRA teachers supervise full pre-k_norm/pre-v_norm deltas.  The
# existing 64-teacher materialized mixtures remain compositional examples;
# their component artists are forced into the 256-artist training split.
kv_reference_direct_delta_320:
  output_directory: kv_reference_direct_delta_r16_320_kvoq_strong_constraints_lr3x_flow_5k_v4
  # Fresh generator and optimizer. Reader alone is initialized from bootstrap.
  seed: 20260826
  blocks: 28
  lora_directory: artist_kv_lora_teachers_rank16_320_b2_v3
  reader_checkpoint: kv_lora_oracle_bootstrap_v3_64_broad256x4/checkpoints/step-0001750.pt
  synthetic_reference_cache: kv_lora_teacher_references_rank16_320x8_realq_v2/dual_query_reference_tokens_v8_step10000
  mixture_reference_cache: kv_activation_mixture_references_rank16_256x4_v1/dual_query_reference_tokens_v8_step10000
  mixture_manifest: kv_activation_mixture_specs_rank16_64_v1/mixtures.parquet
  functional_teacher_cache: kv_lora_functional_teacher_bank_rank16_320_mixtures_compact16x4_v1
  text_context_cache: kv_lora_functional_teacher_bank_rank16_64_v2_broad256x4
  query_cache: kv_real_query_bank_broad64x4_q64_v1
  model:
    architecture: direct_cross_attention
    hidden_dim: 256
    heads: 8
    ff_dim: 1024
    # Removing sample-wise normalization preserves the Reader's native scale.
    # Near-zero preserves the frozen base while avoiding singular zero-vector
    # gradients in diagnostic cosine/common calculations.
    output_init_scale: 0.000001
    normalize_style: false
    normalize_attended: false
    use_block_embedding: false
    # K/V remain dense text-token residuals. Q/O use reference-gated,
    # block-local rank-32 residual projections over the native image stream.
    enable_qo: true
    stream_dim: 2048
    stream_rank: 32
  training:
    device: cuda
    steps: 5000
    # Skip K/V and whole-model teacher materialization entirely. Every optimizer
    # update is supervised by the final image-flow velocity of the frozen DiT.
    flow_only: true
    batch_size: 4
    gradient_accumulation_steps: 1
    blocks_per_step: 4
    # Retained only as split metadata for compatible checkpoint/sample tools.
    training_artists: 256
    single_reference_images: 8
    mixture_reference_images: 4
    materialization_style_chunk: 16
    token_lru_shards: 8
    category_weights: [0.50, 0.125, 0.125, 0.125, 0.125]
    single_reference_counts: [1, 2, 4, 8]
    single_reference_count_weights: [0.30, 0.25, 0.25, 0.20]
    mixture_reference_counts: [1, 2, 4]
    mixture_reference_count_weights: [0.40, 0.35, 0.25]
    heldout_contexts: 32
    heldout_query_contents: 8
    gpu_resident_queries: true
    direction_weight: 0.30
    magnitude_weight: 0.15
    reference_consistency_weight: 0.10
    attention_weight: 0.20
    attention_ramp_steps: 500
    whole_model_functional:
      enabled: false
      require_all_mixture_references: true
      # The complete 14 GB bank is cheap relative to host RAM. Keeping only
      # sixteen random (shard, content, timestep) slices caused synchronous
      # safetensors reads between every DiT pass and left the GPU idle.
      effect_slice_lru_entries: 0
      gpu_resident_effects: true
      huber_beta: 0.10
      direction_weight: 1.0
      constraint_weight: 1.0
      # Common collapse was still rising at 2k while these terms contributed
      # only about five percent of the whole loss. Keep the already-effective
      # RMS band unchanged and strengthen only the two common penalties.
      common_cap_weight: 4.0
      relative_common_weight: 2.0
      rms_band_weight: 1.0
      # Fixed for the entire run and never estimated from a training batch.
      # Convex mixtures legitimately share more direction than single/signed
      # teachers, so each category uses its teacher-calibrated ceiling.
      common_cap: 0.55
      common_cap_by_kind:
        single: 0.30
        pair: 0.55
        triple: 0.55
        amplified: 0.50
        signed: 0.35
      rms_floor: 0.0001
    human_flow:
      enabled: true
      # One artist and one shared reference set supervise 2-4 distinct target
      # contents per update. Noise and timestep remain independent per row.
      batch_size: 4
      same_style_target_min: 2
      same_style_target_max: 4
      prompt_modes: {full: 0.25, tag_dropout: 0.45, short: 0.30, empty: 0.0}
      start_step: 0
      cycle: 1
      slots: [0]
      flow_loss_weight: 1.0
      # Ordinary flow matching is the primary and only positive target.
      flow_mse_weight: 1.0
      residual_huber_weight: 0.0
      direction_weight: 0.0
      # Keep the final residual large enough to remain effective. This is a
      # one-sided hinge below the lower bound, not a fixed target magnitude.
      output_band_weight: 2.0
      constraint_ramp_steps: 1000
      common_cap_start: 0.30
      common_cap_end: 0.30
      common_cap_weight: 0.0
      rms_lower_start: 0.15
      rms_upper_start: 0.75
      rms_lower: 0.25
      rms_upper: 0.75
      rms_band_weight: 1.0
      rms_floor: 0.0001
      # Grouped batches contain one artist, so compare each adapter's K/V/Q/O
      # response on one fixed probe with a detached recent-artist population.
      # Only cosine above the cap is penalized; same-artist rows are not repelled.
      cross_style_diversity_weight: 0.10
      diversity_cosine_cap: 0.35
      diversity_queue_min_styles: 16
      diversity_queue_size: 128
      diversity_probe_blocks: [0, 7, 14, 21, 27]
      diversity_signature_width: 64
      # Ranking is neither standard flow matching nor needed for the first
      # capacity test; disabling it also removes a full DiT backward pass.
      wrong_reference_weight: 0.0
      wrong_reference_margin: 0.02
      min_references: 1
      max_references: 4
      timestep_sampling: shift
      # Jittered quantiles retain the shifted-logistic density but distribute
      # every same-artist group across the trajectory instead of clustering.
      timestep_stratified_quantiles: true
      sigmoid_scale: 1.0
      sigmoid_bias: 0.0
      discrete_flow_shift: 3.0
      # One block mask is shared by every support/query row in the artist
      # group, so dropout cannot become an accidental per-content label.
      group_shared_block_dropout: 0.10
      # Preserve the frozen model's useful prior while the ordinary style-flow
      # objective remains dominant. This replaces null-reference zero loss.
      prior_preservation_weight: 0.05
      fixed_validation_every: 500
      fixed_validation_batches: 4
      prefetch_workers: 4
      prefetch_batches: 8
    # Three-times LR experiment for both trainable components. Generator keeps
    # its long hold while Reader still decays early to limit representation drift.
    generator_learning_rate: 0.000003
    reader_learning_rate: 0.000003
    generator_lr_schedule:
      peak_lr: 0.000003
      warmup_steps: 100
      decay_start_step: 1500
      decay_end_step: 5000
      final_lr: 0.0000003
    reader_lr_schedule:
      peak_lr: 0.000003
      warmup_steps: 100
      decay_start_step: 250
      decay_end_step: 750
      final_lr: 0.00000006
    ema:
      enabled: true
      decay: 0.999
      sample: true
    # Penalize student pairwise cosine only when it exceeds the corresponding
    # teacher geometry. Inference has no Common branch or mean subtraction.
    common_direction_weight: 1.0
    warmup_steps: 100
    betas: [0.9, 0.95]
    adam_eps: 0.00000001
    weight_decay: 0.01
    # The completed 500->4000 run measured p99/max at 17280/28032 for the
    # generator and 10.63/19.0 for Reader. Clip only beyond the observed p99.
    max_grad_norm: 18000.0
    reader_max_grad_norm: 12.0
    adaptive_clip:
      generator: {minimum_history: 100, window: 1000, quantile: 0.99, multiplier: 1.25, floor: 1000.0}
      reader: {minimum_history: 100, window: 1000, quantile: 0.99, multiplier: 1.25, floor: 1.0}
    fused_adamw: true
    log_every: 10
    # K/V validation is intentionally disabled for this flow-only experiment.
    # Fixed-reference and legacy panel samples are the relevant checkpoints.
    validation_every: 0
    validation_tokens: 64
    validation_blocks: [0, 4, 8, 12, 16, 20, 24, 27]
    checkpoint_every: 500
    sample_every: 0
    sample_steps: [500, 1000, 1500, 2000, 3000, 4000, 5000]
    sample_output_root: diagnostics/kv-reference-direct-delta-r16-320-kvoq-strong-constraints-lr3x-flow-5k-v4
    # The output directory is new, so the first segment is fresh. Subsequent
    # 250 -> 500 -> 1k -> 2k -> 5k segments resume only this same run.
    resume: true
    wandb:
      enabled: true
      project: anima-style-adapter
      name: kv-reference-direct-delta-r16-320-kvoq-strong-constraints-lr3x-flow-5k-v4
      id: kv-reference-direct-delta-r16-320-kvoq-strong-constraints-lr3x-flow-5k-v4

