output_dir: data/anima500k-human

anima500k:
  repo_id: ij/anima-style-embedding-500k-full-face
  revision: b8bf93dd0b1950576aa39e0467117b13812659dd
  source: human
  source_dir: source
  download_workers: 16
  extract_workers: 8

megastyle:
  repo_id: tencent/MegaStyle-1.4M
  revision: 5625ac67efa1210e19bf138c0644b16aeaed252a
  source_directory: ../megastyle-1.4m/source
  download_workers: 16
  subset:
    output_directory: ../megastyle-1.4m
    style_count: 5000
    images_per_style: 8
    validation_styles: 250
    seed: 20260819
    seed_styles: 256
    image_workers: 32
    pending_writes: 256
    resampler_batch_size: 64

# Kept for the common pipeline configuration contract. Selection is already
# encoded in the source dataset; 50 candidates are retained before dedup.
metadata: {}
selection:
  artists: 5000
  images_per_artist: 30
  candidate_multiplier: 1.6666667
download: {}
dedup:
  workers: 16
  chunksize: 32
  phash_distance: 6
  dhash_distance: 6
  require_both_hashes: true
tagger:
  repo_id: ashen-sensored/wd-eva02-tagger-2026-canary
  revision: c45a59a3f17c0ca6066072b1c213e0c12a90e242
  architecture: eva02_large_patch14_448
  input_size: 448
  threshold: 0.6025
  score_store_threshold: 0.10
  sparse_top_k: 512
  batch_size: 32
  num_workers: 8
  device: cuda
  shard_rows: 2000
  content_exclude_tags: []

caption:
  version: anima-tags-v1
  rating_map:
    general: safe
    sensitive: sensitive
    questionable: nsfw
    explicit: explicit
  include_rating: true
  include_characters: true
  include_general: true

# Frozen input caches for the full style-transfer training stage. The runtime
# imports the exact Anima implementation from a pinned sd-scripts checkout.
anima_cache:
  sd_scripts_path: /workspace/sd-scripts
  sd_scripts_revision: 37a1cbbc5725ed2a3575506e7bd2001c9908ac92
  models:
    repo_id: circlestone-labs/Anima
    revision: f7382c4bf9d7ffe4ceea593a0adbb470c56dd79b
    qwen3_filename: split_files/text_encoders/qwen_3_06b_base.safetensors
    dit_filename: split_files/diffusion_models/anima-base-v1.0.safetensors
    vae_filename: split_files/vae/qwen_image_vae.safetensors
  text:
    output_directory: anima_text_cache_post_llm
    device: cuda
    batch_size: 64
    shard_rows: 512
    writer_workers: 2
    pending_writes: 4
    qwen_max_length: 512
    t5_max_length: 512
    variants: 2
    general_tag_dropout: 0.15
    variant_seed: 20260811
    allow_tf32: true
  latents:
    output_directory: anima_latent_cache_qwen_2d
    device: cuda
    batch_size: 64
    # Correct-reference regression uses all artists. The quadratic all-pairs
    # branch is partitioned into independent 8-artist negative groups.
    functional_pair_group_size: 8
    max_batch_pixels: 4194304
    shard_rows: 512
    reader_workers: 32
    decoder_workers: 16
    read_prefetch: 4096
    decode_prefetch: 512
    writer_workers: 4
    pending_writes: 8
    pinned_buffers: 2
    preprocess:
      max_side: 1536
      max_pixels: 1048576
      min_side: 256
      bucket_step: 64
      allow_upscale: false
      upscale_below_min: true

cradio:
  torchhub_repo: NVlabs/RADIO
  torchhub_ref: c0f37017930e9dda53f93424cf4bf39fc51f287e
  model_version: c-radio_v4-so400m
  adaptor_name: siglip2-g
  patch_size: 16
  max_side: 1024
  max_pixels: 1048576
  min_side: 16
  batch_size: 4
  device: cuda
  amp_dtype: bfloat16
  storage_dtype: float16
  content_scale: 1.0
  normalize_residual: true
  shard_rows: 128

# Production cache for the selected per-reference style encoder. This is kept
# separate from the earlier L20/L24 pilot cache so the old experiment remains
# reproducible while all human images receive the final feature contract.
style_features:
  output_directory: style_features_l18_l24_siglip_l24
  spatial_layers: [18, 24]
  summary_layers: [24]
  statistics_layers: []
  statistics: [mean, std]
  storage_dtype: float16
  amp_dtype: bfloat16
  batch_size: 64
  shard_rows: 512
  max_open_buckets: 128
  reader_workers: 64
  decoder_workers: 32
  read_prefetch: 32768
  decode_prefetch: 4096
  raw_queue_gib: 12
  writer_workers: 8
  pending_writes: 16
  pinned_buffers: 2
  preprocess:
    max_side: 512
    max_pixels: 262144

# Independent high-capacity style teachers. Anima and the LoRA module graph
# stay resident for the complete 256-artist run; only the rank-16 weights and
# Adam state are reset between artists. Each artist reserves six images for a
# held-out flow check. Artist identity is never present in cached prompts.
artist_lora_teachers:
  output_directory: artist_lora_teachers_rank16_256_b2_v5
  seed: 20260823
  artist_count: 256
  images_per_artist: 30
  train_images_per_artist: 24
  validation_images_per_artist: 6
  split: train
  maximum_bucket_count: 32
  latent_cache: anima_latent_cache_qwen_2d
  text_cache: anima_text_cache_post_llm_multimode_v1
  text_conditioning_length: 512
  pin_memory: true
  variant_names:
    - full
    - full_quality
    - tag_dropout
    - tag_dropout_quality
    - short
    - short_quality
  prompt:
    mode_weights:
      full: 0.30
      tag_dropout: 0.40
      short: 0.20
      empty: 0.10
    quality_probability: 0.50
  training:
    device: cuda
    rank: 16
    alpha: 16
    steps: 500
    batch_size: 2
    learning_rate: 0.0001
    warmup_steps: 50
    minimum_lr_ratio: 0.10
    betas: [0.9, 0.99]
    adam_eps: 0.00000001
    weight_decay: 0.01
    max_grad_norm: 1.0
    fused_adamw: true
    allow_tf32: true
    cudnn_benchmark: true
    low_precision_rmsnorm: true
    attention_mode: torch
    timestep_sampling: shift
    sigmoid_scale: 1.0
    sigmoid_bias: 0.0
    discrete_flow_shift: 3.0
    log_every: 25
    validation_every: 250
    validation_batches: 4
    state_every: 250
    compile:
      enabled: true
      backend: inductor
      mode: default
      dynamic: auto
      fullgraph: false
      cache_size_limit: 32
    wandb:
      enabled: true
      project: anima-style-adapter
      name: artist-lora-teachers-r16-256-b2
      id: artist-lora-teachers-r16-256-b2-v5
  preview:
    enabled: true
    every_artists: 8
    prompt_variant: full_quality
    steps: 20
    flow_shift: 3.0
    text_cfg: 4.0
    seed: 20260823
    tile_size: 320

