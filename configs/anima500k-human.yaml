output_dir: data/anima500k-human

anima500k:
  repo_id: ij/anima-style-embedding-500k-full-face
  revision: b8bf93dd0b1950576aa39e0467117b13812659dd
  source: human
  source_dir: source
  download_workers: 16
  extract_workers: 8

megastyle:
  repo_id: tencent/MegaStyle-1.4M
  revision: 5625ac67efa1210e19bf138c0644b16aeaed252a
  source_directory: ../megastyle-1.4m/source
  download_workers: 16
  subset:
    output_directory: ../megastyle-1.4m
    style_count: 5000
    images_per_style: 8
    validation_styles: 250
    seed: 20260819
    seed_styles: 256
    image_workers: 32
    pending_writes: 256
    resampler_batch_size: 64

# Kept for the common pipeline configuration contract. Selection is already
# encoded in the source dataset; 50 candidates are retained before dedup.
metadata: {}
selection:
  artists: 5000
  images_per_artist: 30
  candidate_multiplier: 1.6666667
download: {}
dedup:
  workers: 16
  chunksize: 32
  phash_distance: 6
  dhash_distance: 6
  require_both_hashes: true
tagger:
  repo_id: ashen-sensored/wd-eva02-tagger-2026-canary
  revision: c45a59a3f17c0ca6066072b1c213e0c12a90e242
  architecture: eva02_large_patch14_448
  input_size: 448
  threshold: 0.6025
  score_store_threshold: 0.10
  sparse_top_k: 512
  batch_size: 32
  num_workers: 8
  device: cuda
  shard_rows: 2000
  content_exclude_tags: []

caption:
  version: anima-tags-v1
  rating_map:
    general: safe
    sensitive: sensitive
    questionable: nsfw
    explicit: explicit
  include_rating: true
  include_characters: true
  include_general: true

# Frozen input caches for the full style-transfer training stage. The runtime
# imports the exact Anima implementation from a pinned sd-scripts checkout.
anima_cache:
  sd_scripts_path: /workspace/sd-scripts
  sd_scripts_revision: 37a1cbbc5725ed2a3575506e7bd2001c9908ac92
  models:
    repo_id: circlestone-labs/Anima
    revision: f7382c4bf9d7ffe4ceea593a0adbb470c56dd79b
    qwen3_filename: split_files/text_encoders/qwen_3_06b_base.safetensors
    dit_filename: split_files/diffusion_models/anima-base-v1.0.safetensors
    vae_filename: split_files/vae/qwen_image_vae.safetensors
  text:
    output_directory: anima_text_cache_post_llm
    device: cuda
    batch_size: 64
    shard_rows: 512
    writer_workers: 2
    pending_writes: 4
    qwen_max_length: 512
    t5_max_length: 512
    variants: 2
    general_tag_dropout: 0.15
    variant_seed: 20260811
    allow_tf32: true
  latents:
    output_directory: anima_latent_cache_qwen_2d
    device: cuda
    batch_size: 64
    # Correct-reference regression uses all artists. The quadratic all-pairs
    # branch is partitioned into independent 8-artist negative groups.
    functional_pair_group_size: 8
    max_batch_pixels: 4194304
    shard_rows: 512
    reader_workers: 32
    decoder_workers: 16
    read_prefetch: 4096
    decode_prefetch: 512
    writer_workers: 4
    pending_writes: 8
    pinned_buffers: 2
    preprocess:
      max_side: 1536
      max_pixels: 1048576
      min_side: 256
      bucket_step: 64
      allow_upscale: false
      upscale_below_min: true

cradio:
  torchhub_repo: NVlabs/RADIO
  torchhub_ref: c0f37017930e9dda53f93424cf4bf39fc51f287e
  model_version: c-radio_v4-so400m
  adaptor_name: siglip2-g
  patch_size: 16
  max_side: 1024
  max_pixels: 1048576
  min_side: 16
  batch_size: 4
  device: cuda
  amp_dtype: bfloat16
  storage_dtype: float16
  content_scale: 1.0
  normalize_residual: true
  shard_rows: 128

# Production cache for the selected per-reference style encoder. This is kept
# separate from the earlier L20/L24 pilot cache so the old experiment remains
# reproducible while all human images receive the final feature contract.
style_features:
  output_directory: style_features_l18_l24_siglip_l24
  spatial_layers: [18, 24]
  summary_layers: [24]
  statistics_layers: []
  statistics: [mean, std]
  storage_dtype: float16
  amp_dtype: bfloat16
  batch_size: 64
  shard_rows: 512
  max_open_buckets: 128
  reader_workers: 64
  decoder_workers: 32
  read_prefetch: 32768
  decode_prefetch: 4096
  raw_queue_gib: 12
  writer_workers: 8
  pending_writes: 16
  pinned_buffers: 2
  preprocess:
    max_side: 512
    max_pixels: 262144

# B-prime per-reference encoder. C-RADIO spatial features and Qwen Image VAE
# latents remain separate K/V banks; learned spatial/global queries read both.
dual_query_resampler:
  output_directory: dual_query_resampler_bprime_v8
  feature_directory: style_features_l18_l24_siglip_l24
  latent_directory: anima_latent_cache_qwen_2d
  seed: 20260815
  model:
    semantic_layers: [18, 24]
    dim: 1024
    spatial_query_grid: 8
    global_queries: 16
    layers: 4
    heads: 16
    ff_dim: 4096
    artist_descriptor_dim: 512
    artist_pooling_queries: 4
    artist_summary_tokens: 4
    semantic_dropout: 0.05
    vae_dropout: 0.10
  training:
    device: cuda
    steps: 10000
    training_artist_count: 3000
    validation_artist_count: 150
    images_per_artist_limit: 15
    artists_per_batch: 16
    images_per_artist: 2
    train_split: train
    validation_split: validation
    learning_rate: 0.0001
    warmup_steps: 250
    minimum_lr_ratio: 0.1
    weight_decay: 0.01
    betas: [0.9, 0.95]
    epsilon: 0.00000001
    fused_adamw: true
    max_grad_norm: 1.0
    semantic_reconstruction_sample_tokens: 192
    # Reconstruction remains active for the entire run. The VAE decoder now
    # carries twice the previous weight so local appearance is not eclipsed by
    # C-RADIO semantic reconstruction.
    semantic_reconstruction_weight: 1.0
    vae_reconstruction_weight: 0.20
    # After the bootstrap, shift capacity toward artist-consistent structure.
    artist_weight: 0.10
    artist_weight_initial: 0.05
    artist_weight_ramp_start: 250
    artist_weight_ramp_end: 1000
    token_diversity_weight: 0.01
    prototype_scale: 16.0
    prototype_margin: 0.10
    prototype_margin_initial: 0.0
    prototype_margin_ramp_start: 250
    prototype_margin_ramp_end: 1000
    contrastive_fraction: 0.25
    contrastive_temperature: 0.10
    # VICReg-style variance prevents the normalized artist descriptors from
    # entering the all-identical saddle. Fixed proxies remain available as a
    # diagnostic but are disabled in the production objective.
    artist_proxy_fraction: 0.0
    artist_proxy_scale: 16.0
    artist_proxy_margin: 0.10
    descriptor_variance_target: 0.012
    summary_variance_target: 0.008
    descriptor_variance_epsilon: 0.000001
    descriptor_variance_weight: 50.0
    summary_artist_fraction: 0.25
    # A centered input teacher only breaks the initial common-direction
    # collapse. It is removed once prototype supervision has a useful signal.
    input_teacher_weight: 0.0
    input_teacher_weight_initial: 20.0
    input_teacher_weight_ramp_start: 250
    input_teacher_weight_ramp_end: 1000
    summary_teacher_weight: 0.0
    teacher_center_samples: 4096
    teacher_center_batch_size: 32
    artist_head_lr_scale: 4.0
    prefetch_workers: 2
    prefetch_batches: 4
    log_every: 20
    validation_every: 250
    validation_batches: 8
    checkpoint_every: 500
    resume: true
    wandb:
      enabled: true
      project: anima-style-adapter
      name: dual-query-resampler-bprime-v8-balanced-bootstrap
      id: dual-query-resampler-bprime-v8-balanced-bootstrap

# Frozen Dual-query Resampler outputs are materialized once, then a compact
# permutation-invariant tokenizer learns native Anima context tokens. This is
# intentionally separate from every earlier StyleTokenizer/IP-Adapter runner.
dual_query_style_tokenizer:
  output_directory: dual_query_style_tokenizer_v1_20k
  seed: 20260816
  train_split: train
  validation_split: validation
  resampler_checkpoint: dual_query_resampler_bprime_v8/checkpoints/step-010000.pt
  cache:
    output_directory: dual_query_reference_tokens_v8_step10000
    device: cuda
    batch_size: 64
    shard_rows: 512
    reader_workers: 8
    prefetch_batches: 16
    writer_workers: 2
    pending_writes: 4
  loader:
    batch_size: 4
    min_references: 1
    max_references: 8
    artist_balanced: true
    self_reference_target_images_per_style: 0
    text_conditioning_length: 512
    text_lru_shards: 4
    latent_lru_shards: 4
    token_lru_shards: 8
    reference_count_weights_by_phase:
      exact_self: [1.0]
      target_mix: [0.45, 0.30, 0.15, 0.10]
      target_excluded: [0.30, 0.24, 0.16, 0.10, 0.07, 0.05, 0.04, 0.04]
  model:
    dim: 1024
    query_tokens: 80
    artist_summary_tokens: 4
    include_artist_summary: true
    output_tokens: 32
    heads: 16
    cross_layers: 1
    cross_slot_layers: 2
    ff_dim: 4096
    output_rms_init: 0.15
  training:
    device: cuda
    steps: 20000
    learning_rate: 0.0001
    betas: [0.9, 0.999]
    adam_eps: 0.00000001
    weight_decay: 0.01
    warmup_steps: 500
    minimum_lr_ratio: 0.10
    max_grad_norm: 1.0
    gradient_accumulation_steps: 4
    fused_adamw: true
    allow_tf32: true
    low_precision_rmsnorm: true
    fuse_attention_projections: true
    timestep_sampling: shift
    sigmoid_scale: 1.0
    sigmoid_bias: 0.0
    discrete_flow_shift: 3.0
    prefetch_workers: 2
    prefetch_batches: 6
    curriculum:
      gate_only_steps: 0
      self_reference_steps: 2000
      target_mix_end_step: 8000
      target_mix_end_probability: 0.5
      target_mix_min_references: 1
      target_mix_max_references: 4
      target_anneal_end: 20000
      target_anneal_min_references: 1
      target_anneal_max_references: 8
    normalized_residual_weight: 0.05
    # Direct residual alignment needs a frozen-Anima baseline forward. Keep it
    # for the exact-self bootstrap, then use one styled forward per microbatch.
    direct_auxiliary_end_step: 2000
    normalized_residual_huber_beta: 0.10
    normalized_residual_scale_floor: 0.0001
    aligned_floor_weight: 0.10
    aligned_floor_start: 0.02
    aligned_floor_end: 0.10
    aligned_floor_ramp_steps: 1000
    reconstruction_weight: 0.0
    reconstruction_final_weight: 0.0
    artist_contrastive_weight: 0.01
    artist_contrastive_temperature: 0.10
    artist_contrastive_every: 2
    slot_diversity_weight: 0.001
    subset_consistency_weight: 0.005
    subset_consistency_start: 2001
    log_every: 10
    validation_every: 250
    validation_batches: 8
    checkpoint_every: 500
    sample_every: 500
    fixed_sample_every: 1000
    resume: true
    wandb:
      enabled: true
      project: anima-style-adapter
      name: dual-query-style-tokenizer-v1
      id: dual-query-style-tokenizer-v1
  ablation:
    output_directory: dual_query_style_tokenizer_summary_ablation_v1
    steps: 1000
    training_overrides:
      warmup_steps: 100
      direct_auxiliary_end_step: 250
      # r1 was a pre-checkpoint validation/consistency dtype failure. Keep its
      # W&B history immutable and give the corrected deterministic rerun a new ID.
      wandb_run_revision: -r2
      validation_every: 250
      checkpoint_every: 500
      sample_every: 500
      fixed_sample_every: 1000
      subset_consistency_start: 251
      curriculum:
        gate_only_steps: 0
        self_reference_steps: 250
        target_mix_end_step: 750
        target_mix_end_probability: 0.5
        target_mix_min_references: 1
        target_mix_max_references: 4
        target_anneal_end: 1000
        target_anneal_min_references: 1
        target_anneal_max_references: 8
  # Summary-ON 10k pilot. This is intentionally isolated from the historical
  # 20k/A-B settings above so checkpoints and W&B histories cannot cross-resume.
  exact_self_teacher:
    output_directory: dual_query_style_tokenizer_exact_self_teacher_3k_v4
    steps: 3000
    training:
