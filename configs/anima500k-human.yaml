      steps: 1000
      minimum_steps: 1000
      early_stop_patience: 0
      checkpoint_every: 250
      validation_every: 250
      validation_batches: 4
      train_heldout_batches: 4
      centered_effect_learning_rate: 0.0001
      wandb:
        enabled: true
        project: anima-style-adapter
        name: offline-artist-specific-stage-a0-capacity64-v3
        id: offline-artist-specific-stage-a0-capacity64-v3
