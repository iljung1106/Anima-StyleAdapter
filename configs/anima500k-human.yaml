    cross_slot_ff_dim: 4096
    reconstruction_layers: 1
    reconstruction_ff_dim: 2048
    reference_score_dim: 256
    output_rms_init: 0.15
  training:
    device: cuda
    steps: 20000
    learning_rate: 0.0001
    betas: [0.9, 0.999]
    adam_eps: 0.00000001
    weight_decay: 0.01
    warmup_steps: 500
    minimum_lr_ratio: 0.10
    max_grad_norm: 1.0
    gradient_accumulation_steps: 4
    fused_adamw: true
    allow_tf32: true
    low_precision_rmsnorm: true
    fuse_attention_projections: true
    timestep_sampling: shift
    sigmoid_scale: 1.0
    sigmoid_bias: 0.0
    discrete_flow_shift: 3.0
