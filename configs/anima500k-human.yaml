  output_directory: style_features_l18_l24_siglip_l24
  spatial_layers: [18, 24]
  summary_layers: [24]
  statistics_layers: []
  statistics: [mean, std]
  storage_dtype: float16
  amp_dtype: bfloat16
  batch_size: 64
  shard_rows: 512
  max_open_buckets: 128
  reader_workers: 64
  decoder_workers: 32
  read_prefetch: 32768
  decode_prefetch: 4096
  raw_queue_gib: 12
  writer_workers: 8
  pending_writes: 16
  pinned_buffers: 2
  preprocess:
    max_side: 512
    max_pixels: 262144

# External controlled benchmark. Each group contains one image from the shard
